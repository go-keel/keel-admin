syntax = "proto3";
package conf.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/go-keel/keel-admin/internal/conf;conf";

message Bootstrap {
  // sys gathers the runtime parameters of the admin kernel and template, read once at startup (restart after a
  // change). Dynamic configuration of the business itself is left to business development, implemented when needed.
  Sys sys = 1;
}

// Sys is the framework-level config root, with fields ordered by how much a new project has to change them: brand,
// business time zone (required) → session → login protection (captcha / lockout) → OTP key. Never commit real values
// of secrets (otp.aes_key and others): app.yaml commits development placeholders, and the deployment layer injects
// real values in production.
message Sys {
  // Brand: every new project changes it. title is required (empty fails startup), logo may be empty, see Brand.
  Brand brand = 1;
  // Session token lifetime (default 30 days). There is no separate "remember me": it only decides whether the session
  // cookie the server sets is persistent (Max-Age) or session-only (lost when the browser closes, see
  // core/sys/service/cookie.go); the token's own lifetime is always this value. The frontend never touches the token:
  // it is an httpOnly cookie.
  // Note: there is no renewal, so this is a hard limit and must be long enough to cover a whole working session; set
  // too short, it logs out people in the middle of their work.
  google.protobuf.Duration session_ttl = 2;
  // Whether the session cookie carries Secure (must be true in production, otherwise it leaks with plaintext
  // requests). A setting rather than sniffing TLS: behind a reverse proxy r.TLS is always nil, and sniffing would
  // silently turn Secure off. Browsers treat localhost as a trustworthy origin, so true also works in development.
  bool cookie_secure = 3;
  Captcha captcha = 4;
  Lockout lockout = 5;
  Otp     otp     = 6;
  // Business time zone: the time zone in which a business "day" is counted, an IANA name (such as Asia/Shanghai).
  // Required: missing or unrecognized fails startup, so business days are never silently split by UTC. The server
  // converts business days to instants by it, and after login sends it to the frontend through
  // /v1/sys/meta/system-info to label filters (see ADR admin-0003).
  string business_time_zone = 7;
}

// Brand is the deployment-time brand: one binary, a config change switches the brand, no frontend rebuild.
message Brand {
  // Brand name, shared by the browser title, header, login page and footer. Required: the template's default brand
  // must not slip into production silently, so empty fails startup (ProvideBrand in deps.go, same as otp.aes_key).
  // Takes effect after a restart. spa.go injects it into index.html (<title> + window.__BRAND__).
  string title = 1;
  // logo is tri-state; one setting serves as both the in-page logo and the favicon (takes effect after a restart).
  // All three states and both forms (dev and embedded deployment) share the one endpoint /v1/sys/brand/logo, and the
  // server sets Content-Type from the real file, so the frontend need not know the logo's format or location:
  //   empty               → the embedded default web/public/logo.svg (travels with the binary, independent of the
  //                          embed_ui tag); a derived repo may replace it with logo.png, replacing the file needs no
  //                          code change (a build-time assembly seam, see web/logo.go)
  //   disk path           → the endpoint serves the file from disk; replacing its content in place takes effect
  //                          immediately (read from disk per request, revalidated by mtime)
  //   http(s):// URL      → the endpoint redirects there with 302; the browser fetches the content from the CDN
  //                          itself, the server does not proxy it
  string logo = 2;
}

message Captcha {
  bool   enabled       = 1; // human verification at login on/off
  // Built in: base64 (image generated by the server) and turnstile (Cloudflare widget); for more, see the registry
  // in internal/core/captcha.
  string provider      = 2;
  int64  base64_length = 3; // number of characters in the image code
  google.protobuf.Duration base64_ttl = 4; // challenge lifetime
  Turnstile turnstile  = 5;
}

// Turnstile is Cloudflare's human verification widget: the frontend renders it with site_key, and the server
// verifies with secret_key against siteverify. Verification includes the client IP, so it requires nginx to
// overwrite XFF per deploy-nginx.md (see AGENTS.md).
message Turnstile {
  // Public value, sent to the login page with login-meta.
  string site_key   = 1;
  // Secret: the repo commits a development placeholder, and the deployment layer injects the real one in production
  // (same as otp.aes_key).
  string secret_key = 2;
}

message Lockout {
  bool  enabled      = 1; // login brute-force protection on/off
  int64 max_failures = 2; // failure threshold
  int64 lock_minutes = 3; // lock duration (minutes)
  // Counter key: username_ip (default) | username.
  // username lets anyone who knows a username lock that account out (DoS); choose it only if that is acceptable.
  string scope       = 4;
}

message Otp {
  string aes_key = 1; // AES key encrypting TOTP secrets (app.yaml commits a development placeholder, injected by the deployment layer in production; empty fails startup)
  // How many times the same one-time code may be used (default 3, see biz.DefaultMaxOTPUses).
  //
  // This is convenience bought with replay risk: set to N, the same code can be submitted N times within its 90s
  // validity window, including by an attacker who intercepted it; the risk grows linearly with N. 1 is the one use
  // per code recommended by RFC 6238 §5.2 (the safest; the cost is that two sensitive operations in a row must wait
  // for the authenticator to show a new code).
  //
  // To ask for the code less often, first merge consecutive sensitive steps into a single endpoint (see UpdateRole in
  // api/keel_admin/v1/role.proto); that path spends no uses. Raising this value is a fallback, not a design tool.
  //
  // 0/negative = not configured, defaults to 3; no upper bound, the value is the deployer's own decision.
  int64 max_uses = 2;
}
