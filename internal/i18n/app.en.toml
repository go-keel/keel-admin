# Business messages: entries referenced by internal/biz|data|service/. Kernel messages are in sys.*.toml in the same
# directory, see the comment at its top. The kernel does not check whether this file is fully translated; a derived
# repo that wants that guarantee adds its own check on its message files. Missing entries fall back to English
# (internal/i18n.MustLocalizeMessage).

# ============ Business domain (internal/biz, extend here) ============

# Example: delete after forking
[ErrNoticeNotFound]
other = "Announcement not found."

# Example: delete after forking
[ErrNoticeCategoryNotFound]
other = "Announcement category not found."

# Example: delete after forking
[ErrNoticeCategoryInUse]
other = "This category still has announcements, so it cannot be deleted."

# Example: delete after forking
[ErrNoticeCategoryExists]
other = "An announcement category with this name already exists."

# ============ Data scope resource display names (localized at read time by ListResources, see perm.ResourceDef.NameKey) ============

