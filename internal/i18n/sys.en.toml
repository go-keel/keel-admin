# Kernel messages: entries referenced by internal/core/ (middleware errors, the system domain, display names of
# kernel permission codes, resources and audit actions). Business entries are in app.*.toml in the same directory, see
# the comment at its top. The kernel only guarantees that this file and sys.zh-CN.toml have the same key set
# (internal/i18n/bundle_test.go); other languages a derived repo adds are not checked, and missing entries fall back
# to English.

# ============ System: middleware errors (core/middleware, localized at emission) ============
# authz/principal errors bypass sentinel; messages are translated in-place via localized().
# ErrNotRoot / ErrOTPUsed are shared between middleware and biz.

[ErrUnauthenticated]
other = "Please sign in first."

[ErrForbidden]
other = "You do not have permission to perform this action."

[ErrNotRoot]
other = "Only a super administrator can do this."

[ErrStepUpOTP]
other = "This sensitive action requires a one-time code. Enter the 6-digit code from your authenticator."

[ErrOTPBindRequired]
other = "Bind an authenticator in your profile before performing this action."

[ErrOTPUsed]
other = "This code has no uses left. Wait for the next one in your authenticator."

[ErrOTPVerifyUnavailable]
other = "The one-time code cannot be checked right now. Try again shortly."

# ============ System: generic fallbacks ============

[ErrInvalidArgument]
other = "Invalid request. Please check your input."

[ErrUnexpectedError]
other = "Something went wrong. Please try again later."

