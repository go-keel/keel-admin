# ============ Permission tree display names (localized at read time by ListPermissions, see perm.Code.NameKey) ============
# Keys derive from the code/group slug: business domain "sys" → perm.sys, feature module "sys:dept" →
# perm.sys.dept, feature operation "sys:dept:view" → perm.sys.dept.view.
#
# **Quote the whole key**: a bare [perm.sys.dept] parses in TOML as a subtable under perm.sys, while perm.sys is
# itself a message, and go-i18n rejects the whole file when "reserved and non-reserved keys are mixed". A quoted key
# is a single flat key with no nesting, so the problem cannot arise.
#
# Every code and group the kernel registers needs an entry in both sys.en.toml and sys.zh-CN.toml; a missing one
# fails cmd/admin's TestPermissionRegistryHasLocalizedNames.

["perm.sys"]
other = "System"

["perm.sys.dept"]
other = "Departments"

["perm.sys.dept.view"]
other = "View departments"

["perm.sys.dept.create"]
other = "Create department"

["perm.sys.dept.update"]
other = "Edit department"

["perm.sys.dept.delete"]
other = "Delete department"

["perm.sys.account"]
other = "Users"

["perm.sys.account.view"]
other = "View users"

["perm.sys.account.create"]
other = "Create user"

["perm.sys.account.update"]
other = "Edit user"

["perm.sys.account.disable"]
other = "Disable user"

["perm.sys.account.enable"]
other = "Enable user"

["perm.sys.account.reset_pwd"]
other = "Reset password"

["perm.sys.account.reset_otp"]
other = "Reset authenticator"

["perm.sys.account.kick"]
other = "Force sign-out"

["perm.sys.audit"]
other = "Audit Logs"

["perm.sys.audit.view"]
other = "View audit logs"

["perm.sys.login_log"]
other = "Sign-in Logs"

["perm.sys.login_log.view"]
other = "View sign-in logs"
