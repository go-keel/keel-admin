# ============ Audit action/target display names (localized at read time, see audit.ActionNameKey) ============
# Every Audit: true operation needs an entry in BOTH sys.en.toml and sys.zh-CN.toml (or,
# for business audited operations, in both app.en.toml and app.zh-CN.toml); a missing
# entry fails cmd/admin's TestAuditedOperationsHaveLocalizedNames — that test loads the
# whole bundle (sys + app), so it doesn't care which file an entry lives in.

