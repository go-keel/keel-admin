# Kernel messages: entries referenced by internal/core/ (middleware errors, the system domain, display names of
# kernel permission codes, resources and audit actions). Business entries are in app.*.toml in the same directory, see
# the comment at its top. The kernel only guarantees that this file and sys.en.toml have the same key set
# (internal/i18n/bundle_test.go); other languages a derived repo adds are not checked, and missing entries fall back
# to English.

# ============ System: middleware errors (core/middleware, localized at emission) ============
# authz/principal errors bypass sentinel; messages are translated in-place via localized().
# ErrNotRoot / ErrOTPUsed are shared between middleware and biz.

[ErrUnauthenticated]
other = "请先登录。"

[ErrForbidden]
other = "没有权限执行此操作。"

[ErrNotRoot]
other = "仅超级管理员可以执行此操作。"

[ErrStepUpOTP]
other = "敏感操作需要动态验证码，请输入认证器当前显示的 6 位数字。"

[ErrOTPBindRequired]
other = "请先在个人中心绑定认证器，再执行此操作。"

[ErrOTPUsed]
other = "该动态验证码的可用次数已用尽，请等待认证器显示下一个。"

[ErrOTPVerifyUnavailable]
other = "动态验证码暂时无法校验，请稍后重试。"

# ============ System: generic fallbacks ============

[ErrInvalidArgument]
other = "输入有误，请检查后再试。"

[ErrUnexpectedError]
other = "出错了，请稍后再试。"

