openapi: 3.0.3
info:
    title: ""
    version: 0.0.1
paths:
    /v1/notices:
        get:
            tags:
                - NoticeService
            operationId: NoticeService_ListNotice
            parameters:
                - name: keyword
                  in: query
                  description: Fuzzy match on the title; an empty string does not filter.
                  schema:
                    type: string
                - name: offset
                  in: query
                  description: |-
                    Pagination has the same shape as the kernel's: offset/limit. The business area does not introduce page/page_size:
                     the server would convert it straight back to offset, buying nothing, while every list page would need its own
                     pagination adapter and the frontend would lose its single shared component.
                  schema:
                    type: integer
                    format: int32
                - name: limit
                  in: query
                  description: |-
                    lte must equal the largest of the frontend PAGE_SIZES (web/src/lib/table.ts): otherwise the UI offers a
                     size that protovalidate rejects with 400. A derived repo that changes pageSizes changes this too.
                  schema:
                    type: integer
                    format: int32
                - name: categoryId
                  in: query
                  description: 0 = no category filter (category grants still apply); >0 = only that category (must be within the grants).
                  schema:
                    type: string
                - name: createdFromDate
                  in: query
                  description: |-
                    Business-day range of the creation time: YYYY-MM-DD, both ends inclusive, converted by the server to instants in
                     the business time zone; an empty end is unbounded. The example of a fixed filter; how to pass it: ADR admin-0003.
                  schema:
                    type: string
                - name: createdToDate
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListNoticeReply'
        post:
            tags:
                - NoticeService
            operationId: NoticeService_CreateNotice
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.CreateNoticeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.NoticeReply'
    /v1/notices/batch-delete:
        post:
            tags:
                - NoticeService
            description: |-
                Batch delete from the table's multi-select calls this, **not** a frontend loop over DeleteNotice: a loop writes N
                 audit entries, and an in-between state like "2 deleted, the 3rd failed" cannot be explained to the person using
                 it. One request, one audit entry, all or nothing in a transaction.

                 POST rather than DELETE: a DELETE with a body is unreliable through proxies and some clients. The path does not
                 collide with `/v1/notices/{id}`, which is a DELETE.
            operationId: NoticeService_BatchDeleteNotice
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.BatchDeleteNoticeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/notices/categories:
        get:
            tags:
                - NoticeService
            description: |-
                Category management list: shown paged, so paged on the server. Bound to ops:notice:category: it serves the
                 category management dialog (create/delete). It and the option set above are two uses of the same data, split into
                 two endpoints. Merging them breaks one side: with the management list as a dropdown, categories on page two
                 cannot be picked; with the option set as the management list, people with only view permission would see the
                 management surface.

                 Both are filtered by the data scope (the same ScopeSpec filters local rows through permdata.ApplyScope; the
                 notice list's use of spec.ResourceIDs is another use of the same grant).
            operationId: NoticeService_ListNoticeCategory
            parameters:
                - name: offset
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: limit
                  in: query
                  description: |-
                    lte must equal the largest of the frontend PAGE_SIZES (web/src/lib/table.ts): otherwise the UI offers a
                     size that protovalidate rejects with 400. A derived repo that changes pageSizes changes this too.
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListNoticeCategoryReply'
        post:
            tags:
                - NoticeService
            operationId: NoticeService_CreateNoticeCategory
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.CreateNoticeCategoryRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.NoticeCategoryReply'
    /v1/notices/categories/options:
        get:
            tags:
                - NoticeService
            description: |-
                Category options (id/name): used by the notice page's filter dropdown, the category selector of the submission
                 form and the category names of list rows. An option set, unpaged: a dropdown must be able to pick any item.

                 Bound to ops:notice:view (see notice_perm.go): the threshold follows **use**; this is data the notice page needs
                 to render, so whoever can open the page can fetch it. Category **management** is another matter, see below.

                 Must come before DeleteNoticeCategory: `/categories/options` and `/categories/{id}` have the same shape, and
                 registration order decides which matches first.
            operationId: NoticeService_ListNoticeCategoryOptions
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListNoticeCategoryOptionsReply'
    /v1/notices/categories/{id}:
        delete:
            tags:
                - NoticeService
            description: |-
                Deleting requires the category to have no notices; afterwards the category's explicit-assignment rows are cleaned
                 up through the kernel's GrantRevoker port (business code never writes sys_* tables directly).
            operationId: NoticeService_DeleteNoticeCategory
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/notices/{id}:
        delete:
            tags:
                - NoticeService
            operationId: NoticeService_DeleteNotice
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/sys/audit-logs:
        get:
            tags:
                - AuditService
            operationId: AuditService_ListAudit
            parameters:
                - name: offset
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: limit
                  in: query
                  description: |-
                    lte must equal the largest of the frontend PAGE_SIZES (web/src/lib/table.ts): otherwise the UI offers a
                     size that protovalidate rejects with 400. A derived repo that changes pageSizes changes this too.
                  schema:
                    type: integer
                    format: int32
                - name: operatorId
                  in: query
                  schema:
                    type: string
                - name: action
                  in: query
                  schema:
                    type: string
                - name: targetType
                  in: query
                  schema:
                    type: string
                - name: targetId
                  in: query
                  schema:
                    type: string
                - name: ip
                  in: query
                  schema:
                    type: string
                - name: createdFromAt
                  in: query
                  description: |-
                    Time as an instant range: UTC RFC3339 (such as "2026-09-01T00:00:00Z"), half-open (>= from, < to); an empty
                     end is unbounded. How to pass it: ADR admin-0003.
                  schema:
                    type: string
                - name: createdToAt
                  in: query
                  schema:
                    type: string
                - name: operatorKeyword
                  in: query
                  description: |-
                    Fuzzy match on the operator's username or nickname. Audit entries store only the operator ID, so the server first
                     finds matching accounts in sys_user and then filters by operator_id (still using idx_operator); deleted accounts
                     do not match. operator_id is an exact match on one account; both may be given.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListAuditReply'
    /v1/sys/audit-logs/actions:
        get:
            tags:
                - AuditService
            description: |-
                Data source of the filter dropdown: the live registry (the Audit: true operations in perm's binding table), sent
                 as a tree grouped by feature (audit target type). It deliberately does not read historical data from the
                 database: the dropdown lists only actions the system currently supports and audits; historical actions (endpoints
                 since removed) are not filter options, and old rows still display through fallback to historical i18n entries,
                 so they stay readable.
            operationId: AuditService_ListAuditActions
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListAuditActionsReply'
    /v1/sys/audit-logs/{id}:
        get:
            tags:
                - AuditService
            description: |-
                Detail of one audit entry: beyond the list row, it has the request body and the reason. The list sends only the
                 fields it shows; the request body can be long and is fetched by id only when viewing the detail.

                 Must be declared after ListAuditActions: HTTP routes are registered in declaration order and the first match
                 wins; declared earlier, /audit-logs/actions would be taken as id=actions and rejected with 400.
            operationId: AuditService_GetAudit
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.AuditLogInfo'
    /v1/sys/auth/account:
        get:
            tags:
                - AuthService
            description: |-
                GetMyAccount is the own-account detail the personal center needs: contact details, department, roles,
                 authenticator binding time, IP allowlist, recent logins. Not merged into Profile: Profile is fetched on every page
                 change and every return to the browser tab, while these need extra queries on departments, roles and the login
                 log, and only the personal center uses them.
                 It is also the source of the "edit profile" form's initial values (fetched fresh on open).
            operationId: AuthService_GetMyAccount
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.MyAccountReply'
    /v1/sys/auth/captcha:
        post:
            tags:
                - AuthService
            description: IssueCaptcha issues one human verification challenge (an empty structure when the current provider needs none).
            operationId: AuthService_IssueCaptcha
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.IssueCaptchaRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.IssueCaptchaReply'
    /v1/sys/auth/favorites/add:
        post:
            tags:
                - AuthService
            description: |-
                AddFavorite / RemoveFavorite add or remove one of one's favorite menus and return the full user settings after the
                 change. Idempotent: adding an existing favorite or removing a missing one succeeds with the list unchanged.

                 Login is enough, with no Audit and no step-up: favorites only change one's own sidebar, touching neither
                 permissions nor others' data. Writes are per item rather than whole overwrites, so two browsers each adding one do
                 not erase each other.
            operationId: AuthService_AddFavorite
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.AddFavoriteRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.UserSettings'
    /v1/sys/auth/favorites/remove:
        post:
            tags:
                - AuthService
            operationId: AuthService_RemoveFavorite
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.RemoveFavoriteRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.UserSettings'
    /v1/sys/auth/favorites/reorder:
        post:
            tags:
                - AuthService
            description: |-
                ReorderFavorites reorders favorites, **overwriting the whole order**, deliberately unlike the per-item add and
                 remove: when dragging to sort, the person really means "this is the whole order", so overwriting is what they want
                 (see ADR admin-0011).

                 It accepts only a **permutation** of the current set: extra paths are rejected, missing paths stay at the end as
                 they are. Without this restriction it would be a whole-overwrite path around the per-item writes: when two browsers
                 each add a favorite, the drag submitted later would erase the one submitted earlier, with nothing showing the
                 person what was lost.
            operationId: AuthService_ReorderFavorites
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.ReorderFavoritesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.UserSettings'
    /v1/sys/auth/login:
        post:
            tags:
                - AuthService
            operationId: AuthService_Login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.LoginRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.LoginReply'
    /v1/sys/auth/login-meta:
        get:
            tags:
                - AuthService
            description: 'LoginMeta is read by the login page before it starts: whether captcha is on and which provider.'
            operationId: AuthService_LoginMeta
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.LoginMetaReply'
    /v1/sys/auth/logout:
        post:
            tags:
                - AuthService
            description: Logout clears the session cookie. The cookie is httpOnly, so the frontend cannot delete it; only the server can.
            operationId: AuthService_Logout
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.LogoutRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/sys/auth/otp/bind:
        post:
            tags:
                - AuthService
            description: BindOTP generates a new secret for the caller, returns provisioning URI.
            operationId: AuthService_BindOTP
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.BindOTPRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.BindOTPReply'
    /v1/sys/auth/otp/confirm:
        post:
            tags:
                - AuthService
            description: |-
                ConfirmOTP verifies the first code and activates the binding.
                 In the binding bootstrap flow (bind-scope token) it returns an access token directly and completes the login: the
                 password was verified when the bind token was issued and the OTP just now, so both factors are present, equivalent
                 to a full login.
            operationId: AuthService_ConfirmOTP
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.ConfirmOTPRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ConfirmOTPReply'
    /v1/sys/auth/otp/unbind:
        post:
            tags:
                - AuthService
            description: |-
                UnbindOTP unbinds the authenticator and requires the password again.

                 Why unbinding is a separate step guarded by the password: letting "rebind" overwrite directly would mean one click
                 voids the authenticator still in use (without the user knowing), and whoever hijacked the session could install
                 their own authenticator without the password and take over. Two steps with a password gate make unbinding an
                 explicit, auditable decision.

                 No step-up OTP: that would leave someone who lost their authenticator unable to help themselves. The password is
                 the gate of this path.
            operationId: AuthService_UnbindOTP
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.UnbindOTPRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/sys/auth/password:
        post:
            tags:
                - AuthService
            description: |-
                ChangeMyPassword changes one's own password (verifying the old one); an administrator resets others through
                 UserService.ResetPassword.
            operationId: AuthService_ChangeMyPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.ChangeMyPasswordRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/sys/auth/profile:
        get:
            tags:
                - AuthService
            operationId: AuthService_Profile
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ProfileReply'
        put:
            tags:
                - AuthService
            description: |-
                UpdateMyProfile changes one's own nickname/avatar/email/phone. The avatar is a data URI; size limit in
                 biz.MaxAvatarBytes (enforced by the server, the frontend is not trusted).
            operationId: AuthService_UpdateMyProfile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.UpdateMyProfileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/sys/depts:
        get:
            tags:
                - DeptService
            operationId: DeptService_ListDept
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListDeptReply'
        post:
            tags:
                - DeptService
            operationId: DeptService_CreateDept
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.CreateDeptRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.DeptInfo'
    /v1/sys/depts/options:
        get:
            tags:
                - DeptService
            description: |-
                Department selector options (a tree, assembled by the client from parent_id; a slim payload without management
                 fields such as status/user_count).

                 It is separate from ListDept not because of the payload but because of the **threshold**: this group is bound to
                 sys:dept:view (department management), while this data serves the department filter and the "department" picker
                 of the user management page, whose users need only sys:account:view (see perm.go). The observed consequence of
                 sharing one endpoint: someone with only account permissions hits 403 on opening user management, although the
                 page needs that data to render.

                 The scope, like ListDept and the user list itself, goes through ARBAC.ManageableDeptIDs (everything for root), so
                 it fits both uses: the department picker offers nothing outside the manageable range (picking it would be
                 rejected with DEPT_OUT_OF_RANGE anyway), and the filter options cover exactly the departments that can appear in
                 the list.

                 Must come before GetDept (/depts/options and /depts/{id} have the same shape, and registration order decides which
                 matches first).
            operationId: DeptService_ListDeptOptions
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListDeptOptionsReply'
    /v1/sys/depts/{id}:
        get:
            tags:
                - DeptService
            description: |-
                Department detail: the source of the edit form's initial values (fetched fresh, not from a list or tree node
                 snapshot).
            operationId: DeptService_GetDept
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.DeptInfo'
        put:
            tags:
                - DeptService
            operationId: DeptService_UpdateDept
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.keel_admin.v1.UpdateDeptRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.DeptInfo'
        delete:
            tags:
                - DeptService
            operationId: DeptService_DeleteDept
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/sys/login-logs:
        get:
            tags:
                - AuditService
            operationId: AuditService_ListLogin
            parameters:
                - name: offset
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: limit
                  in: query
                  description: |-
                    lte must equal the largest of the frontend PAGE_SIZES (web/src/lib/table.ts): otherwise the UI offers a
                     size that protovalidate rejects with 400. A derived repo that changes pageSizes changes this too.
                  schema:
                    type: integer
                    format: int32
                - name: username
                  in: query
                  description: Fuzzy match. In failure rows, username is exactly what was typed and may not be an existing account.
                  schema:
                    type: string
                - name: status
                  in: query
                  description: 0=all 1=success 2=failure
                  schema:
                    type: integer
                    format: int32
                - name: ip
                  in: query
                  schema:
                    type: string
                - name: createdFromAt
                  in: query
                  description: |-
                    Time as an instant range: UTC RFC3339 (such as "2026-09-01T00:00:00Z"), half-open (>= from, < to); an empty
                     end is unbounded. How to pass it: ADR admin-0003.
                  schema:
                    type: string
                - name: createdToAt
                  in: query
                  schema:
                    type: string
                - name: userId
                  in: query
                  description: |-
                    Exact match on the account ID (0 = any): use it to see one account's own logins, since username is a fuzzy match
                     and "zhang" also brings in "zhangsan". Failure rows without a matching account have user_id 0.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.keel_admin.v1.ListLoginReply'
    /v1/sys/meta/my-permissions:
